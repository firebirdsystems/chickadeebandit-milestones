<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Milestones</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: var(--hub-bg, #f9fafb);
      --surface: var(--hub-surface, #ffffff);
      --border: var(--hub-border, #e5e7eb);
      --border-mid: var(--hub-border, #d1d5db);
      --text: var(--hub-text, #000000);
      --muted: var(--hub-text-muted, #6b7280);
      --accent: var(--hub-primary, #111827);
      --accent-hover: var(--hub-primary-hover, #374151);
      --accent-fg: var(--hub-primary-fg, #ffffff);
      --radius: var(--hub-radius, 8px);
      --red: #b91c1c;
      --red-soft: #fee2e2;
      --shadow: 0 1px 3px rgba(15, 23, 42, .07);
    }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: var(--hub-font-size, 15px);
      line-height: 1.5;
    }
    .app { max-width: 680px; margin: 0 auto; padding: 16px; }
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    h1 { font-size: 1.35rem; line-height: 1.2; }
    h2 { font-size: .95rem; }
    .muted { color: var(--muted); }
    .tiny { font-size: .78rem; }
    .stack { display: grid; gap: 10px; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border: 1px solid transparent; border-radius: 8px; padding: 8px 12px;
      font: inherit; font-size: .86rem; font-weight: 700; cursor: pointer;
      min-height: 38px; background: var(--accent); color: var(--accent-fg);
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: .48; cursor: default; }
    .btn-sm { min-height: 30px; padding: 4px 8px; font-size: .78rem; }
    .btn-ghost { background: transparent; color: var(--text); border-color: var(--border-mid); }
    .btn-ghost:hover { background: var(--bg); }
    .btn-quiet {
      min-height: 28px; padding: 3px 8px; background: transparent; color: var(--muted);
      border: 0; font-size: .76rem; font-weight: 700; cursor: pointer; font-family: inherit;
    }
    .btn-quiet:hover { background: var(--bg); color: var(--text); }
    .btn-quiet-danger { min-height: 28px; padding: 3px 8px; background: transparent; color: var(--muted);
      border: 0; font-size: .76rem; font-weight: 700; cursor: pointer; font-family: inherit; }
    .btn-quiet-danger:hover { background: var(--red-soft); color: var(--red); }

    /* Person + household chips */
    .subjects { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .subject-control { display: inline-flex; align-items: center; gap: 2px; }
    .archived-subjects { margin: -4px 0 12px; color: var(--muted); }
    .archived-subjects summary { cursor: pointer; font-size: 13px; }
    .archived-subject-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
      border: 1.5px solid var(--border-mid); background: var(--surface); color: var(--text);
      border-radius: 999px; padding: 5px 12px; font: inherit; font-size: .82rem; font-weight: 700;
    }
    .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

    /* Timeline */
    .year-head {
      display: flex; align-items: center; gap: 10px;
      margin: 18px 0 8px; font-size: .78rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
    }
    .year-head::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    .entry { display: flex; gap: 12px; }
    .entry-rail { display: flex; flex-direction: column; align-items: center; width: 32px; flex: none; }
    .entry-dot {
      width: 30px; height: 30px; flex: none; border-radius: 50%;
      display: grid; place-items: center; font-size: .95rem;
      background: var(--surface); border: 1.5px solid var(--border-mid);
    }
    .entry-line { flex: 1; width: 2px; background: var(--border); margin: 4px 0 -10px; }
    .entry-body { flex: 1; min-width: 0; padding-bottom: 10px; }
    .entry-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .entry-title { font-weight: 700; }
    .entry-meta { margin-top: 1px; color: var(--muted); font-size: .8rem; }
    .entry-note { margin-top: 5px; white-space: pre-wrap; }
    .age { font-weight: 700; color: var(--text); }
    .photos { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .photos img { width: 84px; height: 84px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }

    .banner {
      background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent);
      border-radius: var(--radius); padding: 11px 13px; margin-bottom: 12px;
    }
    .banner h2 { font-size: .74rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 4px; }

    /* Forms + modal */
    .form { display: grid; gap: 10px; }
    .field { display: grid; gap: 4px; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; min-width: 0; }
    label { font-size: .76rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 800; }
    input, textarea, select {
      width: 100%; border: 1.5px solid var(--border-mid); border-radius: 8px;
      padding: 9px 11px; font: inherit; background: var(--surface); color: var(--text);
    }
    textarea { min-height: 64px; resize: vertical; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
    .search-row { margin-bottom: 12px; }
    .search-input { width: 100%; border: 1.5px solid var(--border-mid); border-radius: 8px; padding: 9px 11px; font: inherit; background: var(--surface); color: var(--text); }
    .search-input:focus { outline: none; border-color: var(--accent); }
    .empty, .loading { color: var(--muted); text-align: center; padding: 28px 16px; }
    .error { background: var(--red-soft); color: var(--red); padding: 9px 12px; border-radius: 8px; margin-bottom: 10px; font-size: .86rem; }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15, 23, 42, .45);
      display: grid; place-items: center; padding: 16px; z-index: 50; overflow-y: auto;
    }
    .modal {
      background: var(--surface); border-radius: var(--radius); padding: 16px;
      width: 100%; max-width: 440px; box-shadow: 0 10px 34px rgba(15, 23, 42, .22);
    }
    .modal h2 { margin-bottom: 12px; font-size: 1.05rem; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
    .hint { font-size: .76rem; color: var(--muted); }
    /* "Who is this about?" — checkboxes, because the answer can be nobody. */
    .who { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 2px 0; }
    .who-option { display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
      font: inherit; font-size: .9rem; text-transform: none; letter-spacing: 0; color: var(--text); font-weight: 400; }
    .who-option input { width: auto; min-width: 0; }
    #p-toggle { justify-self: start; text-align: left; }
  </style>
  <base href="/run/milestones/">
</head>
<body>
<div class="app">
  <div id="root" class="loading">Loading…</div>
</div>

<script type="module">
import { esc, hubConfirm, hubAlert, createFilesHelper, searchMatch } from "/hub-sdk.js";
import {
  CATEGORIES, categoryIcon, canonicalDate, formatOccurred,
  canEdit as _canEdit, canDelete as _canDelete, activePeople, archivedPeople,
  normalizeSelectedPersonId, visibleMilestonesFor, filterByPerson,
  linksByMilestone, personIdsFor, attachmentDelta, blockedRemovals,
  peopleOnMilestone, describePeople,
  attachablePeople, attachmentBatchPlan, chunk, unsavedFileIds, resolvePerson,
  sortTimeline, latestTimelinePage, timelinePageFromDescending, mergeTimelineRows,
  onThisDay, searchableFields, todayStr,
} from "./logic.js";
// searchMatch comes from the SDK, not from logic.js: shared.js carries a
// simplified mirror so the pure logic stays testable in node, but the browser
// must use the hub's real matcher (diacritic folding, token-AND) so in-app
// search behaves the same way it does everywhere else in the product.

// --- Hub runtime globals (empty in demo mode) --------------------------------
const CONTEXT    = window.__CONTEXT_URL ?? "";
const DB         = window.__DB_URL ?? "";
const FILES      = window.__FILES_URL ?? "";
const APP_ID     = window.__APP_ID ?? "milestones";
const EVENTS_URL = window.__EVENTS_URL ?? "/api/events";
const ME         = window.__CURRENT_MEMBER ?? null;

const files = createFilesHelper(FILES);
const TIMELINE_PAGE_SIZE = 100;

/**
 * D1 rejects a prepared statement carrying more than 100 bound parameters, so
 * every `IN (?, ?, …)` and every multi-row `VALUES` built from a runtime-sized
 * list has to be split. Kept below 100 for headroom, matching the hub's own
 * D1_MAX_IN_PARAMS. This app can genuinely reach it: `people` is capped at 200
 * rows, and every one of them may be attached to a single milestone.
 */
const MAX_SQL_PARAMS = 90;
/** Bound parameters per attachment row — id, milestone_id, person_id, written_by, created_at. */
const ATTACHMENT_COLUMNS = 5;



// --- App state ---------------------------------------------------------------
let members = [];
let memberById = new Map();
let me = null;
let householdTimeZone = "";
let people = [];
let links = [];          // app_milestones__milestone_people rows for the loaded milestones
let linkIndex = new Map();
let milestones = [];
let anniversaryMilestones = [];
let timelineCursor = null;
let hasEarlierMilestones = false;
let earlierLoadPromise = null;
let searchLoading = false;
let ready = false;
let selectedPersonId = "all";
let searchQ = "";
let timelineLimit = TIMELINE_PAGE_SIZE;
let error = "";
let modalEl = null;
let pendingFiles = [];   // { id, url, isNew } uploaded or already saved for the open form
let uploadSession = 0;   // invalidates uploads that finish after their modal closes
let uploadsInFlight = 0;

function nowIso() { return new Date().toISOString(); }
function canEdit(row) { return _canEdit(row, me); }
function canDelete(row) { return _canDelete(row, me); }
function canArchive(row) { return Boolean(row) && canDelete(row); }
function personById(id) { return people.find((s) => s.id === id) ?? null; }
function personInfo(id) { return resolvePerson(personById(id), members); }
function attachedTo(m) { return peopleOnMilestone(m, linkIndex, people, members); }
function reindexLinks() { linkIndex = linksByMilestone(links); }
function syncAnniversaryRow(row) {
  const today = todayStr(new Date(), householdTimeZone);
  anniversaryMilestones = onThisDay(mergeTimelineRows(anniversaryMilestones, [row]), today);
}

async function db(sql, params = []) {
  if (!DB) return { rows: [], changed: 1 };
  const res = await fetch(DB, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sql, params }),
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok || json.error) throw new Error(json.error || `Database request failed: ${res.status}`);
  return json;
}

/**
 * Several statements as ONE atomic D1 transaction — all of them commit, or none.
 *
 * The hub's `/api/db` batch form is the only atomicity an app gets, and a
 * milestone and its attachments CANNOT share one, for two independent reasons:
 *
 *  - Row policies for every statement in a batch are resolved against the
 *    COMMITTED snapshot, before any of them run. `milestone_people` is
 *    inherit_visibility, so its INSERT asks whether the parent milestone is
 *    visible — and a milestone inserted earlier in the same batch is not there
 *    yet. The batch is refused with "Referenced milestones (column
 *    milestone_id) is not visible to this member". Verified, not assumed.
 *  - `milestones` declares update_file_list_columns and delete_cascades, and
 *    the batch form REJECTS an UPDATE or DELETE of such a table outright: it
 *    cannot resolve the per-statement pre-image the photo reclaim and the
 *    cascade need.
 *
 * So the milestone is always its own statement, and the attachments are their
 * own atomic batch. What the app owes in return is convergence: see
 * saveMilestone, where a failed attachment write leaves a save that a retry
 * completes rather than duplicates.
 *
 * A batch may also contain only ONE insert per capped table (a table with
 * `max_rows`), which is why attachments are added as a single multi-row INSERT
 * rather than one statement each.
 */
async function dbBatch(statements) {
  if (!statements.length) return [];
  if (!DB) return statements.map(() => ({ rows: [], changed: 1 }));
  const res = await fetch(DB, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ statements }),
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok || json.error) throw new Error(json.error || `Database request failed: ${res.status}`);
  return json.results ?? [];
}

// --- Loading -----------------------------------------------------------------
async function loadMembers() {
  if (!CONTEXT) {
    householdTimeZone = "";
    members = [
      { id: "demo-1", name: "Alex", role: "adult" },
      { id: "demo-2", name: "Rowan", role: "child", birthdate: "2019-04-02" },
    ];
  } else {
    const res = await fetch(`${CONTEXT}?keys=family.members,family.preferences`);
    if (!res.ok) throw new Error(`Household context could not be loaded (${res.status}). Refresh before making changes.`);
    const context = await res.json();
    members = context["family.members"] ?? [];
    householdTimeZone = context["family.preferences"]?.timezone ?? "";
    if (!householdTimeZone) {
      throw new Error("The household timezone is unavailable. Refresh before making changes.");
    }
    try {
      todayStr(new Date(), householdTimeZone);
    } catch {
      throw new Error("The household timezone is invalid. Update it in household settings before making changes.");
    }
  }
  memberById = new Map(members.map((m) => [m.id, m]));
  me = ME ?? members[0] ?? { id: "guest", name: "Guest", role: "adult" };
}

async function fetchMilestonePage(cursor = null) {
  const result = cursor
    ? await db(
      `SELECT * FROM app_milestones__milestones
        WHERE (occurred_date < ?
           OR (occurred_date = ? AND created_at < ?)
           OR (occurred_date = ? AND created_at = ? AND id < ?))
        ORDER BY occurred_date DESC, created_at DESC, id DESC LIMIT ?`,
      [cursor.occurred_date, cursor.occurred_date, cursor.created_at,
       cursor.occurred_date, cursor.created_at, cursor.id, TIMELINE_PAGE_SIZE + 1],
    )
    : await db(
      "SELECT * FROM app_milestones__milestones ORDER BY occurred_date DESC, created_at DESC, id DESC LIMIT ?",
      [TIMELINE_PAGE_SIZE + 1],
    );
  return timelinePageFromDescending(result.rows ?? [], TIMELINE_PAGE_SIZE);
}

/**
 * Attachment rows for a set of milestones.
 *
 * Fetched per page rather than wholesale: the join table is bounded at 20,000
 * rows, and a household that has been recording for a decade should not pay for
 * all of them to render one screen. Chunked because D1 binds one parameter per
 * id and a page is 100 milestones — more than a single statement may carry.
 */
async function fetchLinksFor(milestoneIds) {
  const ids = [...new Set(milestoneIds)].filter(Boolean);
  if (!DB || !ids.length) return [];
  const out = [];
  for (const group of chunk(ids, MAX_SQL_PARAMS)) {
    const result = await db(
      `SELECT * FROM app_milestones__milestone_people WHERE milestone_id IN (${group.map(() => "?").join(", ")})`,
      group,
    );
    out.push(...(result.rows ?? []));
  }
  return out;
}

/** Merges attachment rows by id, so re-fetching a page never doubles them. */
function mergeLinks(incoming) {
  const byId = new Map(links.map((l) => [l.id, l]));
  for (const link of incoming) byId.set(link.id, link);
  links = [...byId.values()];
  reindexLinks();
}

async function loadEarlierMilestones() {
  if (!hasEarlierMilestones || !timelineCursor) return;
  if (earlierLoadPromise) return earlierLoadPromise;
  earlierLoadPromise = (async () => {
    const page = await fetchMilestonePage(timelineCursor);
    milestones = mergeTimelineRows(milestones, page.items);
    mergeLinks(await fetchLinksFor(page.items.map((m) => m.id)));
    timelineCursor = page.cursor;
    hasEarlierMilestones = page.hasEarlier;
  })();
  try {
    await earlierLoadPromise;
  } finally {
    earlierLoadPromise = null;
  }
}

async function loadAllMilestonesForSearch() {
  while (hasEarlierMilestones) await loadEarlierMilestones();
}

async function loadAnniversaryMilestones() {
  const today = todayStr(new Date(), householdTimeZone);
  const result = await db(
    `SELECT * FROM app_milestones__milestones
      WHERE date_precision = 'day'
        AND substr(occurred_date, 6, 5) = ?
        AND occurred_date < ?
      ORDER BY occurred_date, created_at, id LIMIT 5000`,
    [today.slice(5), today],
  );
  return result.rows ?? [];
}

async function loadData() {
  if (!DB) {
    // Demo-mode fallback so the app renders with no hub attached.
    people = [
      { id: "demo-p1", member_id: "demo-2", name: "Rowan", birth_date: "2019-04-02", icon: "🌱",
        visibility: "everyone", archived_at: null, created_by: "demo-1", created_at: nowIso(), updated_at: nowIso() },
    ];
    milestones = [
      { id: "demo-m1", title: "First steps", note: "Down the hallway, straight at the dog.",
        category: "first", occurred_date: "2020-03-17", date_precision: "day", file_ids: "[]",
        visibility: "everyone", created_by: "demo-1", created_at: nowIso(), updated_at: nowIso() },
      { id: "demo-m2", title: "First day of school", note: "",
        category: "school", occurred_date: "2024-09-03", date_precision: "day", file_ids: "[]",
        visibility: "everyone", created_by: "demo-1", created_at: nowIso(), updated_at: nowIso() },
      { id: "demo-m3", title: "We got the keys", note: "A household milestone — about nobody in particular.",
        category: "home", occurred_date: "2018-06-21", date_precision: "day", file_ids: "[]",
        visibility: "everyone", created_by: "demo-1", created_at: nowIso(), updated_at: nowIso() },
    ];
    links = [
      { id: "demo-l1", milestone_id: "demo-m1", person_id: "demo-p1", written_by: "demo-1", created_at: nowIso() },
      { id: "demo-l2", milestone_id: "demo-m2", person_id: "demo-p1", written_by: "demo-1", created_at: nowIso() },
    ];
    reindexLinks();
    anniversaryMilestones = milestones;
    timelineCursor = null;
    hasEarlierMilestones = false;
    return;
  }
  const [s, page, anniversaries] = await Promise.all([
    db("SELECT * FROM app_milestones__people ORDER BY created_at"),
    fetchMilestonePage(),
    loadAnniversaryMilestones(),
  ]);
  people = s.rows;
  milestones = page.items;
  timelineCursor = page.cursor;
  hasEarlierMilestones = page.hasEarlier;
  anniversaryMilestones = anniversaries;
  // One round-trip for both sets: an anniversary row is usually already on the
  // first page, and fetchLinksFor de-duplicates the ids either way.
  links = await fetchLinksFor([...page.items, ...anniversaries].map((m) => m.id));
  reindexLinks();
}

async function refresh() {
  error = "";
  ready = false;
  render();
  try {
    await loadMembers();
    await loadData();
    selectedPersonId = normalizeSelectedPersonId(selectedPersonId, people);
    timelineLimit = TIMELINE_PAGE_SIZE;
    ready = true;
  } catch (e) {
    error = e.message;
    members = [];
    memberById = new Map();
    people = [];
    links = [];
    linkIndex = new Map();
    milestones = [];
    anniversaryMilestones = [];
    householdTimeZone = "";
  }
  render();
}

// --- Writes ------------------------------------------------------------------
function requireSingleChange(result, conflictMessage) {
  if (DB && result.changed !== 1) throw new Error(conflictMessage);
}

async function requireActivePeople(personIds) {
  if (!personIds.length) return;
  if (!DB) {
    for (const id of personIds) {
      const person = personById(id);
      if (!person || person.archived_at) throw new Error("Someone you chose is no longer active. Refresh and choose again.");
    }
    return;
  }
  // Chunked: a milestone may name every one of the 200 people the app allows,
  // which is well past what one statement can bind.
  let found = 0;
  for (const group of chunk(personIds, MAX_SQL_PARAMS)) {
    const result = await db(
      `SELECT id FROM app_milestones__people WHERE archived_at IS NULL AND id IN (${group.map(() => "?").join(", ")})`,
      group,
    );
    found += (result.rows ?? []).length;
  }
  if (found !== personIds.length) {
    throw new Error("Someone you chose was archived or changed in another session. Refresh and choose again.");
  }
}

async function savePerson(fields, existingId) {
  const now = nowIso();
  if (existingId) {
    const existing = personById(existingId);
    if (!canEdit(existing)) throw new Error("You cannot edit this person.");
    const result = await db(
      "UPDATE app_milestones__people SET member_id = ?, name = ?, birth_date = ?, icon = ?, updated_at = ? WHERE id = ? AND updated_at = ?",
      [fields.member_id, fields.name, fields.birth_date, fields.icon, now, existingId, existing.updated_at],
    );
    requireSingleChange(result, "This person changed in another session. Refresh before saving your changes.");
    const i = people.findIndex((s) => s.id === existingId);
    if (i !== -1) people[i] = { ...people[i], ...fields, updated_at: now };
    return existingId;
  }
  const row = {
    id: crypto.randomUUID(), member_id: fields.member_id, name: fields.name,
    birth_date: fields.birth_date, icon: fields.icon, visibility: "everyone",
    archived_at: null, created_by: me.id, created_at: now, updated_at: now,
  };
  await db(
    `INSERT INTO app_milestones__people
       (id, member_id, name, birth_date, icon, visibility, created_by, created_at, updated_at)
     VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)`,
    [row.id, row.member_id, row.name, row.birth_date, row.icon, row.visibility, row.created_by, row.created_at, row.updated_at],
  );
  people = [...people, row];
  return row.id;
}

async function archivePerson(id) {
  const row = personById(id);
  if (!row) return;
  if (!canArchive(row)) { error = "Only adults can archive someone."; return render(); }
  const ok = await hubConfirm({
    message: `Archive ${resolvePerson(row, members).name || "this person"}?`,
    description: "Milestones about them are kept, but hidden from the app and its anniversary surfaces. Household milestones stay.",
    confirmLabel: "Archive",
    destructive: true,
  });
  if (!ok) return;
  try {
    const now = nowIso();
    const result = await db(
      "UPDATE app_milestones__people SET archived_at = ?, updated_at = ? WHERE id = ? AND updated_at = ?",
      [now, now, id, row.updated_at],
    );
    requireSingleChange(result, "This person changed in another session. Refresh before archiving.");
    const i = people.findIndex((s) => s.id === id);
    if (i !== -1) people[i] = { ...people[i], archived_at: now, updated_at: now };
    selectedPersonId = "all";
    closeModal();
    render();
  } catch (e) {
    error = e.message;
    render();
  }
}

async function restorePerson(id) {
  const row = personById(id);
  if (!row || !row.archived_at) return;
  if (!canArchive(row)) { error = "Only adults can restore someone."; return render(); }
  try {
    const now = nowIso();
    const result = await db(
      "UPDATE app_milestones__people SET archived_at = NULL, updated_at = ? WHERE id = ? AND updated_at = ?",
      [now, id, row.updated_at],
    );
    requireSingleChange(result, "This person changed in another session. Refresh before restoring.");
    const i = people.findIndex((s) => s.id === id);
    if (i !== -1) people[i] = { ...people[i], archived_at: null, updated_at: now };
    selectedPersonId = id;
    error = "";
    render();
  } catch (e) {
    error = e.message;
    render();
  }
}

async function deleteFilesBestEffort(ids) {
  await Promise.allSettled(ids.filter(Boolean).map((id) => files.delete(id)));
}

/**
 * Refuses an attachment change the caller's row policy would silently drop.
 *
 * `milestone_people` is governed by inherit_visibility, which lets a non-adult
 * delete only rows whose `written_by` is their own — while `canEdit` lets the
 * author of a milestone go on editing it after an adult has changed who it is
 * about. The two rules disagree in exactly that case, and the DELETE would
 * match nothing rather than fail. Checked BEFORE the milestone UPDATE so a
 * refusal leaves nothing half-written.
 */
function assertAttachmentsWritable(currentLinks, personIds) {
  const blocked = blockedRemovals(attachmentDelta(currentLinks, personIds).remove, me);
  if (!blocked.length) return;
  const names = blocked.map((l) => personInfo(l.person_id).name || "someone").join(", ");
  throw new Error(`An adult chose who this milestone is about (${names}). Ask an adult to change that.`);
}

/**
 * The batches that make a milestone's attachments match `personIds`, plus the
 * local rows they imply.
 *
 * Returns a LIST of batches, not one, because two hard limits collide with a
 * milestone that names many people:
 *  - D1 binds at most ~100 parameters per statement, and an attachment row
 *    costs five. So adds are split into groups of MAX_SQL_PARAMS/5, and the
 *    removal `IN (...)` into groups of MAX_SQL_PARAMS.
 *  - A batch may contain only ONE insert into a capped table, and both tables
 *    declare `max_rows`. So the extra insert groups cannot join the first
 *    batch; each becomes its own.
 *
 * The ordinary milestone — a handful of people — still yields exactly one
 * batch, so the common case stays atomic. Beyond that, atomicity degrades to
 * convergence, which is what saveMilestone is built on anyway.
 */
function attachmentStatements(milestoneId, personIds, currentLinks) {
  const { add, remove } = attachmentDelta(currentLinks, personIds);
  const now = nowIso();

  const { removalGroups, insertGroups } = attachmentBatchPlan(
    add, remove, MAX_SQL_PARAMS, ATTACHMENT_COLUMNS,
  );

  const removals = removalGroups.map((group) => ({
    statement: {
      sql: `DELETE FROM app_milestones__milestone_people WHERE id IN (${group.map(() => "?").join(", ")})`,
      params: group.map((l) => l.id),
      // A row-policy rewrite that narrows the DELETE succeeds with zero changes
      // and no error, so the count is the only proof it applied.
      expectChanged: group.length,
    },
    removedIds: group.map((l) => l.id),
  }));

  const added = add.map((personId) => ({
    id: crypto.randomUUID(), milestone_id: milestoneId, person_id: personId,
    // Forced to the caller hub-side by the policy's writer_column; sent so demo
    // mode and the local cache agree with what the database will hold.
    written_by: me.id, created_at: now,
  }));
  const byPersonId = new Map(added.map((r) => [r.person_id, r]));
  const inserts = insertGroups.map((ids) => ids.map((id) => byPersonId.get(id))).map((group) => ({
    statement: {
      sql: `INSERT INTO app_milestones__milestone_people (id, milestone_id, person_id, written_by, created_at)
            VALUES ${group.map(() => "(?, ?, ?, ?, ?)").join(", ")}`,
      params: group.flatMap((r) => [r.id, r.milestone_id, r.person_id, r.written_by, r.created_at]),
      expectChanged: group.length,
    },
    added: group,
  }));

  // Removals and the first insert group share one transaction — the shape a
  // normal edit produces. Anything past that is a batch of its own. Each batch
  // carries the local rows it implies, so a run that stops partway can still
  // fold in exactly what committed.
  const batches = [];
  const head = [...removals, ...inserts.slice(0, 1)];
  if (head.length) {
    batches.push({
      statements: head.map((part) => part.statement),
      added: head.flatMap((part) => part.added ?? []),
      removedIds: head.flatMap((part) => part.removedIds ?? []),
    });
  }
  for (const part of inserts.slice(1)) {
    batches.push({ statements: [part.statement], added: part.added, removedIds: [] });
  }
  return batches;
}

/** Folds one committed batch into the local cache. */
function applyAttachmentsLocally({ added, removedIds }) {
  if (removedIds.length) {
    const gone = new Set(removedIds);
    links = links.filter((l) => !gone.has(l.id));
  }
  if (added.length) links = [...links, ...added];
  reindexLinks();
}

/** Runs prepared statements and refuses a write the database narrowed away. */
async function runExpecting(statements, conflictMessage) {
  const results = await dbBatch(statements.map(({ sql, params }) => ({ sql, params })));
  if (!DB) return;
  statements.forEach((statement, i) => {
    if (results[i]?.changed !== statement.expectChanged) throw new Error(conflictMessage);
  });
}

/**
 * Writes an attachment delta, and says plainly when the milestone saved but its
 * people did not.
 */
async function writeAttachments(milestoneId, personIds, currentLinks) {
  for (const batch of attachmentStatements(milestoneId, personIds, currentLinks)) {
    try {
      await runExpecting(
        batch.statements,
        "Who this milestone is about changed in another session. Refresh before saving your changes.",
      );
    } catch (e) {
      // Whatever committed before this stays committed and has already been
      // folded in. The retry re-reads the attachments and recomputes the delta,
      // so it picks up where this left off rather than repeating it.
      throw new Error(`The milestone was saved, but who it is about was not: ${e.message} Press save again to finish.`);
    }
    applyAttachmentsLocally(batch);
  }
}

/**
 * Stops the open form from reclaiming photos a saved row now references.
 *
 * `closeModal` deletes every still-`isNew` upload, which is right while a form
 * is unsaved and wrong the instant its `file_ids` commit — and both save paths
 * can fail AFTER that commit, leaving the form open over a milestone that
 * already points at these bytes.
 */
function markPhotosDurable() {
  pendingFiles = pendingFiles.map((f) => ({ ...f, isNew: false }));
}

/** The attachments a milestone actually has right now, not the ones we cached. */
async function currentLinksFor(milestoneId) {
  if (!DB) return links.filter((l) => l.milestone_id === milestoneId);
  return await fetchLinksFor([milestoneId]);
}

/**
 * Saves a milestone and who it is about.
 *
 * The milestone row and its attachments cannot commit together (see dbBatch),
 * so this does not pretend to be atomic. It is instead built to CONVERGE: the
 * milestone commits first, `onCommitted` promotes the caller's form to an edit
 * of that row, and only then are the attachments written as one atomic batch.
 * If that batch fails, the form the member is still looking at now edits the
 * saved milestone — so pressing save again re-reads the attachments, recomputes
 * the delta, and finishes the job. It cannot create a second milestone, and it
 * cannot trip the optimistic `updated_at` guard, because both paths refresh the
 * cached row the moment the database accepts it.
 */
/**
 * Announces a newly recorded milestone on the event bus. Best-effort by design:
 * a delivery failure is reported to the member, never allowed to undo the save.
 */
async function publishRecorded(row, personIds) {
  if (!DB) return "";
  try {
    // `subject_id` names the ONE member an event is about. A milestone can be
    // about several people, or about the household and nobody in particular —
    // both of which are honestly reported as no subject rather than by picking
    // a winner.
    const attachedMembers = personIds.map((id) => personById(id)?.member_id).filter(Boolean);
    const res = await fetch(EVENTS_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      keepalive: true,
      body: JSON.stringify({
        source_app_id: APP_ID,
        type: "milestones.recorded",
        subject_id: attachedMembers.length === 1 ? attachedMembers[0] : null,
        payload: {
          title: row.title,
          category: row.category,
          occurred_date: row.occurred_date,
          date_precision: row.date_precision,
          people: personIds.length,
        },
      }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.error || `Event request failed: ${res.status}`);
    }
    return "";
  } catch (e) {
    return e.message;
  }
}

async function saveMilestone(fields, personIds, existingId, onCommitted = () => {}, announce = false) {
  const now = nowIso();
  const fileIds = JSON.stringify(pendingFiles.map((f) => f.id));

  if (existingId) {
    const existing = milestones.find((m) => m.id === existingId);
    if (!canEdit(existing)) throw new Error("You cannot edit this milestone.");
    const current = await currentLinksFor(existingId);
    // Only the NEWLY ticked people have to be active. An archived person who
    // was already attached stays attached — see attachablePeople.
    const delta = attachmentDelta(current, personIds);
    await requireActivePeople(delta.add);
    assertAttachmentsWritable(current, personIds);

    const result = await db(
      `UPDATE app_milestones__milestones
         SET title = ?, note = ?, category = ?,
             occurred_date = ?, date_precision = ?, file_ids = ?, updated_at = ?
       WHERE id = ? AND updated_at = ?`,
      [fields.title, fields.note, fields.category,
       fields.occurred_date, fields.date_precision, fileIds, now, existingId, existing.updated_at],
    );
    requireSingleChange(result, "This milestone changed in another session. Refresh before saving your changes.");
    // The saved row references these photos now, so they are no longer this
    // form's to reclaim. Without this, cancelling after a failed attachment
    // write would delete bytes the stored file_ids still point at.
    markPhotosDurable();

    // Advance the cached row BEFORE touching attachments: without this, a retry
    // of a save whose attachment batch failed would send the timestamp the
    // database has already replaced, and the optimistic guard would reject
    // every attempt from here on.
    const i = milestones.findIndex((m) => m.id === existingId);
    if (i !== -1) {
      milestones[i] = { ...milestones[i], ...fields, file_ids: fileIds, updated_at: now };
      syncAnniversaryRow(milestones[i]);
    }

    await writeAttachments(existingId, personIds, current);
    // `announce` is set only when this edit is finishing a create whose
    // attachments failed the first time. Without it the recovered milestone
    // would never emit milestones.recorded, and every automation keyed on it
    // would miss a milestone that really was recorded.
    const publishWarning = announce ? await publishRecorded({ ...existing, ...fields }, personIds) : "";
    return { publishWarning };
  }

  await requireActivePeople(personIds);
  const row = {
    id: crypto.randomUUID(), ...fields, file_ids: fileIds, visibility: "everyone",
    created_by: me.id, created_at: now, updated_at: now,
  };
  await db(
    `INSERT INTO app_milestones__milestones
       (id, title, note, category, occurred_date, date_precision, file_ids, visibility, created_by, created_at, updated_at)
     VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`,
    [row.id, row.title, row.note, row.category, row.occurred_date,
     row.date_precision, row.file_ids, row.visibility, row.created_by, row.created_at, row.updated_at],
  );
  milestones = [...milestones, row];
  syncAnniversaryRow(row);
  // The milestone exists now. Anything that fails past this point must be
  // finishable by editing it, never by creating it again.
  markPhotosDurable();
  onCommitted(row.id);

  await writeAttachments(row.id, personIds, []);
  return { publishWarning: await publishRecorded(row, personIds) };
}

async function deleteMilestone(id) {
  const row = milestones.find((m) => m.id === id);
  if (!row) return;
  if (!canDelete(row)) { error = "Only adults can remove a milestone."; return render(); }
  const ok = await hubConfirm({
    message: "Remove this milestone?",
    description: "A milestone is meant to be permanent. This cannot be undone.",
    confirmLabel: "Remove",
    destructive: true,
  });
  if (!ok) return;
  try {
    const result = await db(
      "DELETE FROM app_milestones__milestones WHERE id = ? AND updated_at = ?",
      [id, row.updated_at],
    );
    requireSingleChange(result, "This milestone changed in another session. Refresh before removing it.");
    milestones = milestones.filter((m) => m.id !== id);
    anniversaryMilestones = anniversaryMilestones.filter((m) => m.id !== id);
    // Its attachment rows go with it hub-side via manifest.delete_cascades;
    // drop them locally so the index does not keep naming a milestone that is
    // no longer there.
    links = links.filter((l) => l.milestone_id !== id);
    reindexLinks();
    // The manifest's delete_file_list_columns records durable cleanup after
    // commit and rechecks references before deleting shared bytes.
    render();
  } catch (e) {
    error = e.message;
    render();
  }
}

function parseFileIds(row) {
  try {
    const v = JSON.parse(row.file_ids ?? "[]");
    return Array.isArray(v) ? v : [];
  } catch { return []; }
}

// --- Modal -------------------------------------------------------------------
function openModal(html) {
  closeModal();
  modalEl = document.createElement("div");
  modalEl.className = "modal-backdrop";
  modalEl.innerHTML = `<div class="modal">${html}</div>`;
  modalEl.addEventListener("click", (e) => { if (e.target === modalEl) closeModal(); });
  document.body.appendChild(modalEl);
  modalEl.querySelector("[data-autofocus]")?.focus();
}
function closeModal({ keepNewUploads = false } = {}) {
  uploadSession += 1;
  uploadsInFlight = 0;
  if (!keepNewUploads) {
    void deleteFilesBestEffort(unsavedFileIds(pendingFiles));
  }
  modalEl?.remove();
  modalEl = null;
  pendingFiles = [];
}

          ${members.map((m) => `<option value="${esc(m.id)}"${m.id === linked ? " selected" : ""}>${esc(m.name)}</option>`).join("")}
        </select>
      </div>
      <div id="p-details" class="stack">

/**
 * Fills name and birthday from the roster and hides them, once a member is
 * chosen and the fields hold nothing the roster does not already have.
 *
 * Never overwrites something already typed: an edit whose stored birthday is
 * the only one that survived the guest strip must not be blanked by a roster
 * row that has none.
 */
function syncPersonDetails({ adopt = false } = {}) {
  const form = modalEl?.querySelector("#person-form");
  if (!form) return;
  const f = form.elements;
  const member = memberById.get(f.member_id.value) ?? null;
  if (adopt && member) {
    if (!f.name.value.trim()) f.name.value = member.name ?? "";
    if (!f.birth_date.value && member.birthdate) f.birth_date.value = member.birthdate;
  }
  const details = form.querySelector("#p-details");
  const toggle = form.querySelector("#p-toggle");
  // Only a roster-linked person can have their details collapsed: without a
  // member there is no other source for the name, so the fields are the form.
  const collapsible = Boolean(member) && !details.dataset.forceOpen;
  details.hidden = collapsible;
  toggle.hidden = !collapsible;
  toggle.textContent = member?.birthdate || f.birth_date.value
    ? "Edit name and birthday"
    : "Add a birthday, to show how old they were";
}

/**
 * "Who is this about?" — zero, one, or several people.

        <label>Who is this about?</label>

          ${list.map(({ person, archived }) => {
            const info = resolvePerson(person, members);
            return `<label class="who-option"><input type="checkbox" name="person_ids" value="${esc(person.id)}"${chosen.has(person.id) ? " checked" : ""} /> <span>${esc(person.icon || "🌱")} ${esc(info.name)}${archived ? ` <span class="muted tiny">(archived)</span>` : ""}</span></label>`;
          }).join("")}

      <div class="field">

      <div class="field">
        <label for="m-precision">How well do you know the date?</label>
        <select id="m-precision" name="date_precision">
          <option value="day"${precision === "day" ? " selected" : ""}>The exact day</option>
          <option value="month"${precision === "month" ? " selected" : ""}>The month</option>
          <option value="year"${precision === "year" ? " selected" : ""}>Only the year</option>
        </select>
      </div>
      <div class="row">
        <div class="field">
          <label for="m-year">Year</label>

        </div>

/** The ticked people, as ids. A form with no people offers no checkboxes. */

}

/** Shows the month/day inputs only at the precision that actually uses them. */

function visibleMilestones() {
  let list = filterByPerson(
    visibleMilestonesFor(milestones, linkIndex, people),

    list = list.filter((m) => searchMatch(searchQ, searchableFields(m, attachedTo(m).map((e) => e.name))));

  const who = attachedTo(m);

  const whoText = describePeople(who);
  const meta = [
    formatOccurred(m.occurred_date, m.date_precision),
    whoText ? `<span class="age">${esc(whoText)}</span>` : "",
  ].filter(Boolean).join(" · ");

  return `
    <div class="entry">

function renderTimeline() {
  const all = visibleMilestones();
  if (!all.length) {
    if (searchLoading) return `<div class="card empty">Searching the full timeline…</div>`;
    if (searchQ) return `<div class="card empty">Nothing matches "${esc(searchQ)}".</div>`;
    if (selectedPersonId === "household") return `<div class="card empty">Nothing yet that is about the household rather than a person — the day you got the keys, the day the tree went in.</div>`;
    if (selectedPersonId !== "all") {
      return `<div class="card empty">Nothing recorded about ${esc(personInfo(selectedPersonId).name || "them")} yet.</div>`;
    }
    return `<div class="card empty">No milestones yet. The first one is usually the hardest to remember the date of — "the month" is a fine answer.</div>`;
  }
  const { items: list, hiddenCount } = latestTimelinePage(all, timelineLimit);
  let html = searchLoading
    ? `<div class="card empty">Searching the full timeline…</div>`
    : (hiddenCount || (!searchQ && hasEarlierMilestones)
      ? `<button class="btn btn-ghost" type="button" data-show-earlier${earlierLoadPromise ? " disabled" : ""}>${earlierLoadPromise ? "Loading…" : `Show ${hiddenCount ? Math.min(TIMELINE_PAGE_SIZE, hiddenCount) : TIMELINE_PAGE_SIZE} earlier milestones`}</button>`
      : "");
  let year = null;
  list.forEach((m, i) => {
    const y = m.occurred_date.slice(0, 4);
    if (y !== year) { year = y; html += `<div class="year-head">${esc(y)}</div>`; }
    const nextY = list[i + 1]?.occurred_date.slice(0, 4);
    html += renderEntry(m, i === list.length - 1 || nextY !== y);
  });
  return html;
}

function renderOnThisDay() {
  const today = todayStr(new Date(), householdTimeZone);
  const hits = visibleMilestonesFor(anniversaryMilestones, linkIndex, people);
  if (!hits.length) return "";
  return `
    <div class="banner">
      <h2>On this day</h2>
      ${hits.map((m) => {
        const names = attachedTo(m).map((e) => e.name).filter(Boolean).join(" and ");
        const years = Number(today.slice(0, 4)) - Number(m.occurred_date.slice(0, 4));
        const ago = years === 1 ? "a year" : `${years} years`;
        return `<div>${esc(m.title)}${names ? ` — ${esc(names)}` : ""}, ${ago} ago</div>`;
      }).join("")}
    </div>
  `;
}

function render() {
  const list = activePeople(people);
  const archived = archivedPeople(people);
  const shown = visibleMilestonesFor(milestones, linkIndex, people);
  const hasHousehold = shown.some((m) => personIdsFor(linkIndex, m.id).length === 0);
  const root = document.getElementById("root");
  root.className = "app";
  if (!ready) {
    root.innerHTML = `
      <div class="topbar">
        <div>
          <h1>Milestones</h1>
          <p class="muted tiny">The firsts and the once-evers, kept for good.</p>
        </div>
        <button class="btn btn-ghost btn-sm" type="button" data-refresh>Refresh</button>
      </div>
      ${error ? `<div class="error">${esc(error)}</div>` : `<div class="card empty">Loading…</div>`}
    `;
    return;
  }
  root.innerHTML = `
    <div class="topbar">
      <div>
        <h1>Milestones</h1>
        <p class="muted tiny">The firsts and the once-evers, kept for good.</p>
      </div>
      <button class="btn btn-ghost btn-sm" type="button" data-refresh>Refresh</button>
    </div>
    ${error ? `<div class="error">${esc(error)}</div>` : ""}
    ${renderOnThisDay()}
    <div class="subjects">
      ${list.length || hasHousehold ? `<button class="chip" type="button" aria-pressed="${selectedPersonId === "all"}" data-person="all">Everything</button>` : ""}
      ${hasHousehold ? `<button class="chip" type="button" aria-pressed="${selectedPersonId === "household"}" data-person="household">🏡 The household</button>` : ""}
      ${list.map((s) => {
        const info = resolvePerson(s, members);
        return `<span class="subject-control">
          <button class="chip" type="button" aria-pressed="${s.id === selectedPersonId}" data-person="${esc(s.id)}">${esc(s.icon || "🌱")} ${esc(info.name)}</button>
          ${canEdit(s) ? `<button class="btn-quiet" type="button" data-edit-person="${esc(s.id)}" aria-label="Edit ${esc(info.name)}">Edit</button>` : ""}
        </span>`;
      }).join("")}
      <button class="chip" type="button" data-add-person>+ Someone</button>
    </div>
    ${archived.some(canArchive) ? `
      <details class="archived-subjects">
        <summary>Archived (${archived.length})</summary>
        <div class="archived-subject-list">
          ${archived.filter(canArchive).map((s) => {
            const info = resolvePerson(s, members);
            return `<button class="btn-quiet" type="button" data-restore-person="${esc(s.id)}">Restore ${esc(info.name)}</button>`;
          }).join("")}
        </div>
      </details>` : ""}
    <button class="btn" type="button" data-add-milestone>Add a milestone</button>
    ${shown.length ? `
      <div class="search-row" style="margin-top:12px">
        <input id="search" class="search-input" type="search" placeholder="Search milestones…" aria-label="Search milestones" value="${esc(searchQ)}" />
      </div>` : ""}
    <section id="timeline" style="margin-top:6px">${renderTimeline()}</section>
  `;
}

// --- Events ------------------------------------------------------------------
document.addEventListener("click", async (event) => {
  const btn = event.target.closest("button");
  if (!btn) return;

  if (btn.matches("[data-refresh]"))  { refresh(); return; }
  if (btn.matches("[data-close]"))    { closeModal(); return; }

  if (btn.hasAttribute("data-person")) {
    selectedPersonId = btn.getAttribute("data-person");
    timelineLimit = TIMELINE_PAGE_SIZE;
    render();
    return;
  }
  if (btn.matches("[data-show-earlier]")) {
    if (visibleMilestones().length > timelineLimit) {
      timelineLimit += TIMELINE_PAGE_SIZE;
      render();
      return;
    }
    render();
    try {
      const visibleBefore = visibleMilestones().length;
      do {
        await loadEarlierMilestones();
      } while (hasEarlierMilestones && visibleMilestones().length === visibleBefore);
      timelineLimit += TIMELINE_PAGE_SIZE;
    } catch (e) {
      error = e.message;
    }
    render();
    return;
  }
  if (btn.matches("[data-add-person]")) { openModal(personForm(null)); syncPersonDetails(); return; }
  if (btn.hasAttribute("data-edit-person")) {
    const row = personById(btn.getAttribute("data-edit-person"));
    if (row && canEdit(row)) { openModal(personForm(row)); syncPersonDetails(); }
    return;
  }
  if (btn.matches("#p-toggle")) {
    const details = modalEl?.querySelector("#p-details");
    if (details) { details.dataset.forceOpen = "1"; syncPersonDetails(); details.querySelector("input")?.focus(); }
    return;
  }
  if (btn.hasAttribute("data-archive-person")) {
    await archivePerson(btn.getAttribute("data-archive-person"));
    return;
  }
  if (btn.hasAttribute("data-restore-person")) {
    await restorePerson(btn.getAttribute("data-restore-person"));
    return;
  }
  if (btn.matches("[data-add-milestone]")) {
    // A person chip pre-ticks that person; "Everything" and "The household"
    // both open with nobody ticked, which is a household milestone.
    const preset = selectedPersonId === "all" || selectedPersonId === "household" ? [] : [selectedPersonId];
    openModal(milestoneForm(null, preset));
    syncPrecisionFields();
    return;
  }
  if (btn.hasAttribute("data-edit-milestone")) {
    const row = milestones.find((m) => m.id === btn.getAttribute("data-edit-milestone"));
    if (!row) return;
    openModal(milestoneForm(row, personIdsFor(linkIndex, row.id)));
    pendingFiles = parseFileIds(row).map((id) => ({ id, url: files.url(id), isNew: false }));
    syncPrecisionFields();
    renderPendingPhotos();
    return;
  }
  if (btn.hasAttribute("data-delete-milestone")) {
    deleteMilestone(btn.getAttribute("data-delete-milestone"));
    return;
  }
  if (btn.hasAttribute("data-drop-file")) {
    const id = btn.getAttribute("data-drop-file");
    const dropped = pendingFiles.find((f) => f.id === id);
    pendingFiles = pendingFiles.filter((f) => f.id !== id);
    if (dropped?.isNew) await deleteFilesBestEffort([id]);
    renderPendingPhotos();
    return;
  }
});

document.addEventListener("change", async (event) => {
  if (event.target.id === "m-precision") { syncPrecisionFields(); return; }
  if (event.target.id === "p-member") { syncPersonDetails({ adopt: true }); return; }
  if (event.target.id !== "m-photo") return;

  const input = event.target;
  const chosen = [...input.files];
  const session = uploadSession;
  uploadsInFlight += chosen.length;
  input.value = "";
  for (const file of chosen) {
    try {
      // Never record a file id before the upload resolves — a 413/415/507 here
      // would otherwise leave a milestone pointing at a photo that never landed.
      const uploaded = await files.upload(file);
      if (session !== uploadSession || !modalEl?.contains(input)) {
        await deleteFilesBestEffort([uploaded.id]);
        break;
      }
      pendingFiles.push({ ...uploaded, isNew: true });
      renderPendingPhotos();
    } catch (e) {
      if (session === uploadSession) {
        await hubAlert("That photo could not be uploaded.", { description: e.message });
      }
    } finally {
      if (session === uploadSession) uploadsInFlight = Math.max(0, uploadsInFlight - 1);
    }
  }
});

document.addEventListener("input", async (event) => {
  if (event.target.id !== "search") return;
  searchQ = event.target.value;
  timelineLimit = TIMELINE_PAGE_SIZE;
  const el = document.getElementById("timeline");
  if (el) el.innerHTML = renderTimeline();
  if (!searchQ.trim() || !hasEarlierMilestones || searchLoading) return;
  searchLoading = true;
  if (el) el.innerHTML = renderTimeline();
  try {
    await loadAllMilestonesForSearch();
  } catch (e) {
    error = e.message;
  } finally {
    searchLoading = false;
    render();
  }
});

document.addEventListener("submit", async (event) => {
  const form = event.target;
  if (form.id !== "person-form" && form.id !== "milestone-form") return;
  event.preventDefault();

  const submit = form.querySelector('.modal-actions button[type="submit"]');
  const label = submit?.textContent;
  let postSaveWarning = "";
  if (submit) { submit.disabled = true; submit.textContent = "Saving…"; }

  try {
    // Read inputs through form.elements, never form.<name>: HTMLFormElement
    // already owns `name` and `title` as DOM properties, so `form.title` is the
    // element's tooltip string, not the input.
    const f = form.elements;
    if (form.id === "person-form") {
      // The roster name is the fallback when the collapsed field is empty —
      // choosing a member IS naming them, so an untouched form still saves.
      const name = f.name.value.trim() || memberById.get(f.member_id.value)?.name?.trim() || "";
      if (!name) {
        form.querySelector("#p-details").dataset.forceOpen = "1";
        syncPersonDetails();
        f.name.focus();
        throw new Error("A name is required.");
      }
      const id = await savePerson({
        name,
        member_id: f.member_id.value,
        birth_date: f.birth_date.value,
        icon: f.icon.value.trim() || "🌱",
      }, form.dataset.id || null);
      if (!form.dataset.id) selectedPersonId = id;
    } else {
      const title = f.title.value.trim();
      if (!title) { f.title.focus(); throw new Error("Say what happened."); }
      if (uploadsInFlight > 0) throw new Error("Wait for the selected photos to finish uploading.");
      const precision = f.date_precision.value;
      const result = await saveMilestone({
        title,
        note: f.note.value.trim(),
        category: f.category.value,
        date_precision: precision,
        occurred_date: canonicalDate(
          Number(f.year.value),
          Number(f.month.value),
          Number(f.day.value || 1),
          precision,
        ),
      }, checkedPersonIds(form), form.dataset.id || null,
         // Promotes this form to an edit the instant the milestone row commits,
         // so a failure while writing its people is finished by pressing save
         // again rather than creating a second milestone. `owesAnnounce` rides
         // along so the finishing edit still publishes milestones.recorded.
         (id) => { form.dataset.id = id; form.dataset.owesAnnounce = "1"; },
         form.dataset.owesAnnounce === "1");
      delete form.dataset.owesAnnounce;
      postSaveWarning = result?.publishWarning ?? "";
    }
    error = "";
    timelineLimit = TIMELINE_PAGE_SIZE;
    closeModal({ keepNewUploads: true });
    render();
    if (postSaveWarning) {
      await hubAlert("Milestone saved, but its automation event could not be delivered.", {
        description: postSaveWarning,
      });
    }
  } catch (e) {
    error = e.message;
    if (submit) { submit.disabled = false; submit.textContent = label; }
    render();
    await hubAlert("That change could not be saved.", { description: e.message });
  }
});

refresh();
</script>
